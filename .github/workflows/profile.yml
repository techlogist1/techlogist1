name: profile

# ONE workflow regenerates every dynamic SVG and commits once.
#
# Not one workflow per widget: four workflows would be four independent failure
# surfaces and four ways for the profile to end up partially stale with nothing
# on the page saying so. The release panel that used to justify its own file is
# folded in here as just another generator.

on:
  schedule:
    # Daily. Not hourly: the generators are deterministic given the same data,
    # so a more frequent run would almost always produce an identical tree and
    # commit nothing. :17 rather than :00 because scheduled jobs queue heavily
    # on the hour and GitHub drops them under load.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    # Regenerate when the generator itself changes, so a code change is visible
    # on the profile without waiting for the next scheduled run.
    branches: [main]
    paths:
      - 'tools/generate.py'
      - 'tools/caliper.py'
      - 'tools/r3d.py'
      - 'data/accounts.toml'
      - '.github/workflows/profile.yml'

concurrency:
  group: profile-regen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # continue-on-error is deliberate and is the whole degradation story.
      # A generator that throws leaves its existing SVG untouched on disk, so
      # the README keeps rendering the last good image. Letting the step fail
      # the job here would skip the commit below and throw away the panels that
      # DID regenerate. The failure is re-raised at the end instead, so the run
      # still goes red in the Actions tab.
      - name: Regenerate SVGs
        id: gen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/generate.py

      - name: Verify nothing unsafe or empty was produced
        id: verify
        continue-on-error: true
        run: python tools/verify.py assets/*.svg

      - name: Commit whatever regenerated cleanly
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md is generated output too: the species accounts, the kit
          # list, the plans and the deposited list are written between markers
          # by the generator, so pushing a new repository updates the page with
          # no edit to this repository at all.
          if git diff --quiet -- assets README.md; then
            echo "no change in assets/ or README.md -- nothing to commit"
            exit 0
          fi
          git add assets README.md
          git commit -m "profile: regenerate dynamic panels

          Generated by .github/workflows/profile.yml. The panels are
          deterministic given the same upstream data, so this commit means
          something upstream actually changed."
          # The scheduled run races nothing, but a manual dispatch can overlap
          # a push; rebase rather than force.
          git pull --rebase --autostash origin main
          git push

      - name: Surface generator or verifier failure
        if: steps.gen.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "::error::A generator or the verifier failed. Panels that "\
          "succeeded were still committed; the ones that failed kept their "\
          "last committed SVG, so the README is stale rather than broken."
          exit 1
