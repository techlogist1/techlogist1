<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 214" width="527" height="214" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">By the numbers</title>
<desc id="d">Real counts from the GitHub API: commits, lines added, contributions, longest streak, releases, repositories, language bytes and account age. No stars or followers.</desc>
<style>
.glass{fill:#15110C}
.edge{fill:none;stroke:#241B12;stroke-width:1}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono",monospace;font-size:13px;white-space:pre;fill:#E8A33D}
.fr{fill:#B07D2A} .hi{fill:#F7E7C6} .ac{fill:#9B3A2E} .dm{fill:#7A5A2E}
.cool{fill:#E8E4D2} .deep{fill:#7A2620} .body{fill:#E8A33D} .scrim{opacity:1}
.rust{fill:#C25A1E} .gold{fill:#D9B45B} .plum{fill:#8E4A5E}
.g0{fill:#5A3A18} .g1{fill:#8A5A20} .g2{fill:#C25A1E} .g3{fill:#E8A33D}
.q0{fill:#3A2E1E} .q1{fill:#8A6224} .q2{fill:#C08A2E} .q3{fill:#E8A33D} .q4{fill:#F7E7C6}
.scan{opacity:.05}
.vig{opacity:1}
@media (prefers-color-scheme: light){
  .glass{fill:#F2E7D3}
  .edge{stroke:#DCC9A8}
  text{fill:#8A4F14}
  .fr{fill:#9A6E24} .hi{fill:#2B1D0E} .ac{fill:#8C2F27} .dm{fill:#A08769}
  .cool{fill:#3F4A44} .deep{fill:#6B1F1A} .body{fill:#8A4F14} .scrim{opacity:0}
  .rust{fill:#A8430F} .gold{fill:#8A6A1E} .plum{fill:#7A3A4C}
  .g0{fill:#D8C4A2} .g1{fill:#BE9354} .g2{fill:#A8430F} .g3{fill:#8A4F14}
  .q0{fill:#DFCDAC} .q1{fill:#C9A263} .q2{fill:#A9741F} .q3{fill:#8A4F14} .q4{fill:#4A2A0A}
  .scan{opacity:.028}
  .vig{opacity:.18}
}
</style>
<defs>
  <pattern id="sl" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="3" fill="#000"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="46%" r="78%">
    <stop offset="58%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".34"/>
  </radialGradient>
</defs>
<rect class="glass" width="527" height="214" rx="8"/>
<text x="22" y="42" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">┌─ BY THE NUMBERS ───────────────────────────────────────── ─┐</tspan></text>
<text x="22" y="58" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">commits, public repositories ....................... </tspan><tspan class="hi">1,407</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="74" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">lines added, public repositories ................. </tspan><tspan class="hi">789,305</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="90" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">contributions, last 365 days ....................... </tspan><tspan class="hi">4,251</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="106" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">longest daily streak ............................. </tspan><tspan class="hi">24 days</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="122" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">releases published ..................................... </tspan><tspan class="hi">6</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="138" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">public repositories .................................... </tspan><tspan class="hi">3</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="154" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">Rust, bytes on disk ................................ </tspan><tspan class="hi">1317k</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="170" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">TypeScript, bytes on disk .......................... </tspan><tspan class="hi">1852k</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="186" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="dm">account opened ........................ </tspan><tspan class="hi">Feb 2022 (4.6 yrs)</tspan><tspan class="fr">│</tspan></text>
<text x="22" y="202" textLength="483.6" lengthAdjust="spacing"><tspan class="fr">└─────────────────────────────────── no stars, no followers ─┘</tspan></text>
<rect class="scan" x="0" y="-12" width="527" height="238" fill="url(#sl)"/>
<rect class="vig" width="527" height="214" rx="8" fill="url(#vig)"/>
<rect class="edge" x=".5" y=".5" width="526" height="213" rx="8"/>
</svg>
