<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-labelledby="ht hd">
<title id="ht">Lokavya Singh — local-first desktop software that keeps its receipts</title>
<desc id="hd">An amber CRT terminal frame. Three projects: flint, a desktop timer that is really a plugin engine; vysted, a finance terminal an agent can drive; ulpf, a log pipeline that proves what it read. Built in Rust, TypeScript and Tauri.</desc>
<style>
/* ── warm phosphor ────────────────────────────────────────────────────
   No CSS custom properties anywhere, deliberately. resvg and other
   non-browser renderers drop var() and fall back to black, which would
   make the degraded state an error state. Literal colours in the base
   rules mean the fallback IS the dark design; the media block overrides
   for light. Dark is the base because it is the intended artwork.
   ──────────────────────────────────────────────────────────────────── */
.glass{fill:#15110C}
.edge{fill:none;stroke:#241B12;stroke-width:1}
text{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono",monospace;
  font-size:17px; white-space:pre; fill:#E8A33D;
}
.fr{fill:#B07D2A}
.hi{fill:#F7E7C6}
.ac{fill:#9B3A2E}
.dm{fill:#7A5A2E}
.bl{opacity:.5}
.scan{opacity:.055}
.vig{opacity:1}

@media (prefers-color-scheme: light){
  .glass{fill:#F2E7D3}
  .edge{stroke:#DCC9A8}
  text{fill:#8A4F14}
  .fr{fill:#9A6E24}
  .hi{fill:#2B1D0E}
  .ac{fill:#8C2F27}
  .dm{fill:#A08769}
  .bl{opacity:.12}
  .scan{opacity:.028}
  /* black edge-darkening reads as CRT curvature on glass and as a dirty
     smudge on paper, so the vignette is nearly dialled out in light. */
  .vig{opacity:.18}
}

/* Base state IS the finished frame. Keyframes supply only the entrance,
   via fill-mode backwards, so a renderer with no animation support shows
   the image complete rather than blank. */
.ln{opacity:1}
@keyframes lineIn{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
.ln{animation:lineIn .52s cubic-bezier(.2,.7,.3,1) backwards}
.l0{animation-delay:.10s} .l1{animation-delay:.20s}
.l2{animation-delay:.30s} .l3{animation-delay:.46s}
.l4{animation-delay:.58s} .l5{animation-delay:.70s}
.l6{animation-delay:.86s} .l7{animation-delay:.98s}

/* power-on sweep — base opacity 0, so it never shows in a static render */
.sweep{opacity:0}
@keyframes powerOn{
  0%{opacity:0;transform:translateY(-46px)}
  12%{opacity:.85}
  88%{opacity:.5}
  100%{opacity:0;transform:translateY(292px)}
}
.sweep{animation:powerOn 1.15s ease-out .05s 1}

/* the ONE continuously-moving element on this image */
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(6px)}}
.scan{animation:drift 4s linear infinite}

@media (prefers-reduced-motion: reduce){
  .ln,.scan{animation:none}
  .sweep{display:none}
}
</style>
