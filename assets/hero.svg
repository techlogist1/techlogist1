<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 362" width="556" height="362" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Lokavya Singh — local-first desktop software that keeps its receipts</title>
<desc id="d">A monochrome terminal frame over a field running cellular automaton rule 110, seeded with the real contribution year. Three projects: flint, a timer that is really a plugin engine; vysted, a finance terminal an agent can drive; ulpf, a log pipeline that proves what it read.</desc>
