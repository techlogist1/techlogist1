<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 382" width="556" height="382" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Lokavya Singh — desktop apps that run on your own computer</title>
<desc id="d">A terminal frame. Three log lines in three different formats -- nginx, JSON and syslog -- are carried stage by stage into one common schema, each row a stage out of phase with the others. Three projects: flint, a timer whose every mode is a plugin; vysted, a finance terminal an AI agent can drive; ulpf, a log parser that keeps the original bytes.</desc>
