<defs>
  <pattern id="sl" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="3" fill="#000"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="46%" r="76%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".42"/>
  </radialGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7E7C6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#F7E7C6" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#F7E7C6" stop-opacity="0"/>
  </linearGradient>
  <filter id="bloom" x="-6%" y="-6%" width="112%" height="112%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>

  <!-- xml:space="preserve" is load-bearing. The CSS white-space:pre property
       is honoured by browsers but NOT by resvg's text layout; without this
       attribute every run of padding spaces collapses to one and the frame
       never closes. Verified by rasterising, not assumed.
       Line advance is 20px against a 17px font (~1.18em) because that is
       roughly where box-drawing glyphs tile seamlessly, as they do in a
       terminal. At the 24px I first used, every vertical rule was visibly
       broken between rows. -->
  <g id="body" xml:space="preserve">
    <text class="ln l0" x="63.5" y="64" ><tspan class="fr">┌─ </tspan><tspan class="hi">LOKAVYA SINGH</tspan><tspan class="fr"> ──────────────────────────────── </tspan><tspan class="dm">JAIPUR · IN</tspan><tspan class="fr"> ─┐</tspan></text>
    <text class="ln l1" x="63.5" y="84" ><tspan class="fr">│</tspan>                                                              <tspan class="fr">│</tspan></text>
    <text class="ln l2" x="63.5" y="104"><tspan class="fr">│</tspan>   <tspan class="hi">Local-first desktop software that keeps its receipts.</tspan>      <tspan class="fr">│</tspan></text>
    <text class="ln l3" x="63.5" y="124"><tspan class="fr">│</tspan>                                                              <tspan class="fr">│</tspan></text>
    <text class="ln l4" x="63.5" y="144"><tspan class="fr">│</tspan>   <tspan class="ac">&gt;</tspan> <tspan class="hi">flint    </tspan>a desktop timer that is really a plugin engine  <tspan class="fr">│</tspan></text>
    <text class="ln l5" x="63.5" y="164"><tspan class="fr">│</tspan>   <tspan class="ac">&gt;</tspan> <tspan class="hi">vysted   </tspan>a finance terminal an agent can drive           <tspan class="fr">│</tspan></text>
    <text class="ln l6" x="63.5" y="184"><tspan class="fr">│</tspan>   <tspan class="ac">&gt;</tspan> <tspan class="hi">ulpf     </tspan>a log pipeline that proves what it read         <tspan class="fr">│</tspan></text>
    <text class="ln l7" x="63.5" y="204"><tspan class="fr">│</tspan>                                                              <tspan class="fr">│</tspan></text>
    <text class="ln l7" x="63.5" y="224"><tspan class="fr">└──────────────────────────────────</tspan> <tspan class="dm">rust · typescript · tauri</tspan> <tspan class="fr">─┘</tspan></text>
  </g>
</defs>

<rect class="glass" width="780" height="280" rx="10"/>
<g class="bl"><use href="#body" filter="url(#bloom)" aria-hidden="true"/></g>
<use href="#body"/>
<rect class="scan" x="0" y="-12" width="780" height="304" fill="url(#sl)"/>
<rect class="sweep" x="0" y="0" width="780" height="46" fill="url(#sw)"/>
<rect class="vig" width="780" height="280" rx="10" fill="url(#vig)"/>
<rect class="edge" x=".5" y=".5" width="779" height="279" rx="10"/>
</svg>
