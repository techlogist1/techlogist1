<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 362" width="556" height="362" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Lokavya Singh — desktop apps that run on your own computer</title>
<desc id="d">A terminal frame. Two sentences -- &quot;It runs on your own computer&quot; and &quot;Your data stays in your files&quot; -- are interleaved character by character and separate back into two readable lines; nothing is added or removed at any point. Three projects: flint, a timer whose every mode is a plugin; vysted, a finance terminal an AI agent can drive; ulpf, a log parser that keeps the original bytes.</desc>
