<text x="22" y="145" textLength="512.4" lengthAdjust="spacing"><tspan class="fr">│    </tspan><tspan class="hi">11cf4f5</tspan><tspan class="dm"> &lt;── </tspan><tspan class="hi">54f901c</tspan><tspan class="dm"> &lt;── </tspan><tspan class="hi">6829ca8</tspan><tspan class="dm"> &lt;── </tspan><tspan class="hi">de18df2            </tspan><tspan class="fr">│</tspan></text>
