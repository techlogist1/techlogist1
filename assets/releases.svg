<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 621 118" width="621" height="118" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Latest release per repository</title>
<desc id="d">The most recent published release or tag for each public repository, with asset counts.</desc>
<style>
.glass{fill:#15110C}
.edge{fill:none;stroke:#241B12;stroke-width:1}
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono",monospace;font-size:13px;white-space:pre;fill:#E8A33D}
.fr{fill:#B07D2A} .hi{fill:#F7E7C6} .ac{fill:#9B3A2E} .dm{fill:#7A5A2E}
.q0{fill:#3A2E1E} .q1{fill:#8A6224} .q2{fill:#C08A2E} .q3{fill:#E8A33D} .q4{fill:#F7E7C6}
.scan{opacity:.05}
.vig{opacity:1}
@media (prefers-color-scheme: light){
  .glass{fill:#F2E7D3}
  .edge{stroke:#DCC9A8}
  text{fill:#8A4F14}
  .fr{fill:#9A6E24} .hi{fill:#2B1D0E} .ac{fill:#8C2F27} .dm{fill:#A08769}
  .q0{fill:#DFCDAC} .q1{fill:#C9A263} .q2{fill:#A9741F} .q3{fill:#8A4F14} .q4{fill:#4A2A0A}
  .scan{opacity:.028}
  .vig{opacity:.18}
}
</style>
<defs>
  <pattern id="sl" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="3" fill="#000"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="46%" r="78%">
    <stop offset="58%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".34"/>
  </radialGradient>
</defs>
<rect class="glass" width="621" height="118" rx="8"/>
<text x="22" y="42" textLength="577.2" lengthAdjust="spacing"><tspan class="fr">┌─ LATEST RELEASE ────────────────────────────────────── per repository ─┐</tspan></text>
<text x="22" y="58" textLength="577.2" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="hi">ulpf             </tspan><tspan class="ac">v0.1.0-rc3    </tspan><tspan class="dm">2026-09-07  8 assets, pre-release      </tspan><tspan class="fr">│</tspan></text>
<text x="22" y="74" textLength="577.2" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="hi">vysted-terminal  </tspan><tspan class="ac">v0.8.0        </tspan><tspan class="dm">            tagged, no release cut     </tspan><tspan class="fr">│</tspan></text>
<text x="22" y="90" textLength="577.2" lengthAdjust="spacing"><tspan class="fr">│  </tspan><tspan class="hi">flint            </tspan><tspan class="ac">v0.1.4        </tspan><tspan class="dm">2026-06-06  4 assets, release          </tspan><tspan class="fr">│</tspan></text>
<text x="22" y="106" textLength="577.2" lengthAdjust="spacing"><tspan class="fr">└────────────────────────────────────────────── published releases only ─┘</tspan></text>
<rect class="scan" x="0" y="-12" width="621" height="142" fill="url(#sl)"/>
<rect class="vig" width="621" height="118" rx="8" fill="url(#vig)"/>
<rect class="edge" x=".5" y=".5" width="620" height="117" rx="8"/>
</svg>
